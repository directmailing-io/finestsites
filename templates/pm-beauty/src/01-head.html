<!DOCTYPE html>
<html lang="de" data-theme="{{farbthema}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schönheit von innen &amp; außen · {{vorname}}</title>
<meta name="description" content="Die Beauty-Empfehlung von {{vorname}}: Pflege von außen, ein Beauty-Drink von innen. Lass dich kostenlos und unverbindlich im Beauty-Check beraten.">
<meta name="theme-color" content="#FDF7EF">

<!-- Sprache früh setzen — verhindert Flackern beim ersten Layout-Paint. -->
<script>
(function(){
  try {
    var stored = localStorage.getItem('fs-lang');
    var lang = stored || (navigator.language && navigator.language.toLowerCase().startsWith('en') ? 'en' : 'de');
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang);
  } catch(e) {
    document.documentElement.setAttribute('data-lang', 'de');
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/hero/{{hero_variante}}.webp" fetchpriority="high" type="image/webp">
<!-- Wunsch-Schriften (lizenzpflichtig): Sang Bleu Sunrise + Sofia Pro. Greifen automatisch, sobald die Dateien in assets/fonts/ liegen.
     Bis dahin ähnliche freie Schriften als Ersatz: Gloock (statt Sang Bleu Sunrise) und Outfit (statt Sofia Pro). -->
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Sang Bleu Sunrise'; src: local('Sang Bleu Sunrise'), local('SangBleuSunrise-Regular'), url('assets/fonts/SangBleuSunrise-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Sofia Pro'; src: local('Sofia Pro'), local('SofiaPro-Regular'), url('assets/fonts/SofiaPro-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Sofia Pro'; src: local('Sofia Pro Medium'), local('SofiaPro-Medium'), url('assets/fonts/SofiaPro-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Sofia Pro'; src: local('Sofia Pro SemiBold'), local('SofiaPro-SemiBold'), url('assets/fonts/SofiaPro-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
</style>

<style>
:root {
  --font: 'Sofia Pro', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display: 'Sang Bleu Sunrise', 'Gloock', Georgia, 'Times New Roman', serif;
  --mono: var(--font);
  --serif: var(--display);
  --pad-x: clamp(20px, 4vw, 56px);
  --max: 1280px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --r: 24px; --r-sm: 16px; --r-xs: 12px;
  /* Feste Farben des Innen/außen-Bildes (unabhängig vom Thema) */
  --aussen: #FBAB6B; --aussen-deep: #5B2A10; --innen: #7F2734;
}

/* ============ FARBTHEMEN ============ */
/* Variablennamen wie in den anderen Templates (--green = Primärfarbe) */
html[data-theme="sand"], html:not([data-theme]), html[data-theme=""] {
  --aussen: #FBAB6B; --aussen-deep: #5B2A10; --innen: #7F2734;
  --bg: #FDF7EF; --bg-2: #F7ECDF; --paper: #FFFCF8;
  --ink: #3E2A20; --ink-2: #6F5A4E; --ink-3: #9A867A;
  --line: #EEE3D6; --line-2: #DDCDBC;
  --green: #8B5A3C; --green-dark: #6E452C; --green-soft: #F3E6D8; --green-deep: #3B2518;
  --accent: #D9B99A;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="rose"] {
  --aussen: #F3B9A6; --aussen-deep: #5A2418; --innen: #7A2238;
  --bg: #FBF5F2; --bg-2: #F4E6E1; --paper: #FFFCFB;
  --ink: #3A2422; --ink-2: #6B5351; --ink-3: #9C8886;
  --line: #EDDDD7; --line-2: #DCC6BF;
  --green: #B5636C; --green-dark: #934B54; --green-soft: #F6E3E3; --green-deep: #3F1F23;
  --accent: #DDA8A4;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="salbei"] {
  --aussen: #CFE0C6; --aussen-deep: #24402C; --innen: #2F4F3C;
  --bg: #F6F7F2; --bg-2: #E9EDE3; --paper: #FDFDFA;
  --ink: #243029; --ink-2: #4E5C53; --ink-3: #8B968F;
  --line: #DEE5DA; --line-2: #C7D1C3;
  --green: #5E7D69; --green-dark: #47634F; --green-soft: #E4ECE5; --green-deep: #22332A;
  --accent: #BFCFB9;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="pflaume"] {
  --aussen: #E6C2DA; --aussen-deep: #4A2242; --innen: #5B2A52;
  --bg: #F8F3F6; --bg-2: #EEE2EA; --paper: #FDFBFC;
  --ink: #30202C; --ink-2: #5E4A58; --ink-3: #978A94;
  --line: #E7D9E2; --line-2: #D3C2CD;
  --green: #86476E; --green-dark: #6B3557; --green-soft: #F0E0EC; --green-deep: #331A2D;
  --accent: #D7B6CE;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="eigene"] {
  --aussen: var(--fs-bright); --aussen-deep: var(--fs-dark-1); --innen: var(--fs-dark-1);
  --bg: var(--fs-paper-2); --bg-2: var(--fs-paper-3); --paper: var(--fs-surface);
  --ink: var(--fs-ink); --ink-2: var(--fs-ink-2); --ink-3: var(--fs-ink-3);
  --line: var(--fs-line); --line-2: var(--fs-ink-3);
  --green: var(--fs-primary); --green-dark: var(--fs-primary-hover); --green-soft: var(--fs-tint); --green-deep: var(--fs-dark-1);
  --accent: var(--fs-bright);
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}

/* ============ BASIS ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font); font-optical-sizing: auto; background: var(--bg); color: var(--ink-2); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; font-size: 16px; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-optical-sizing: auto; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; color: var(--ink); }
h1 { font-size: clamp(48px, 7vw, 108px); line-height: 0.98; letter-spacing: -0.04em; }
h2 { font-size: clamp(34px, 4vw, 60px); }
h3 { font-size: clamp(22px, 2vw, 30px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 400; }
h1 em, h2 em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; font-size: 1.08em; line-height: 0.9; }
h3 em { font-style: normal; font-weight: 400; }
p { color: var(--ink-2); }
.wrap { max-width: var(--max); margin: 0 auto; }
.lead { font-size: clamp(16px, 1.25vw, 18px); line-height: 1.6; color: var(--ink-2); }
.foot-note { font-size: 12.5px; line-height: 1.55; color: var(--ink-3); }
section { padding: clamp(64px, 9vh, 120px) var(--pad-x); position: relative; }
/* Eyebrow-Pill (ohne Punkt – Daniels Vorgabe) */
.eye { display: inline-flex; align-items: center; padding: 7px 13px; border-radius: 100px; background: var(--paper); border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.eye.light { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.3); color: #fff; backdrop-filter: blur(8px); }
.s-head { max-width: 860px; margin: 0 auto clamp(32px, 4vh, 52px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.s-head h2 { max-width: 18ch; }
.s-head p { max-width: 560px; font-size: 17px; }
.arr { display: inline-block; transition: transform .2s var(--ease); }

/*@@REUSE_CSS@@*/

/* ============ Übernommene Leiste/Knöpfe/FAQ/Fußzeile an den Stil anpassen ============ */
.wrap { padding: 0; }
.lang-switch[hidden] { display: none !important; }
.nav { background: transparent; border-bottom: 0; }
.nav.scrolled { background: rgba(253, 247, 239, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.nav-inner { padding: 14px var(--pad-x); }
.nav-links { gap: 22px; font-size: 14.5px; white-space: nowrap; font-weight: 600; }
.brand { font-weight: 700; } .brand-text { white-space: nowrap; }
.nav-cta { white-space: nowrap; background: var(--ink); color: #fff; font-weight: 700; padding: 10px 18px; }
.nav-cta:hover { background: var(--green-dark); color: #fff; }
.btn { font-weight: 700; font-size: 15px; padding: 14px 24px; border-radius: 100px; }
.btn-primary { background: var(--green); color: #fff; box-shadow: none; }
.btn-primary:hover { background: var(--green-dark); color: #fff; }
.btn-ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line-2); }
.btn-ghost:hover { background: var(--bg-2); }
.btn-light { background: #fff; color: var(--ink); }
.btn-light:hover { background: var(--bg-2); color: var(--ink); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: var(--green-dark); color: #fff; }
#faq { background: var(--paper); border-top: 1px solid var(--line); }
.faq-wrap { max-width: 760px; margin: 0 auto; }
#faq h2 { text-align: center; margin-bottom: 32px; }
.faq-list { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 26px; }
.faq-q { font-family: var(--display); font-size: clamp(17px, 1.4vw, 20px); font-weight: 500; letter-spacing: -0.01em; color: var(--ink); padding: 20px 0; }
.faq-a-inner { font-size: 15.5px; color: var(--ink-2); padding-bottom: 20px; }
.pm-disclaimer { background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
/* Fußzeile: hell, ohne Trennlinien, FinestSites gut sichtbar */
footer { background: var(--bg-2); }
.footer-cols { border-bottom: 0; margin-bottom: 28px; padding-bottom: 0; }
.footer-bottom { align-items: center; }
.footer-made { gap: 10px; font-size: 14px; color: var(--ink); font-weight: 600; }
.footer-made a img { height: 24px; opacity: 1; }
.footer-made .heart { margin: 0 5px; }
.footer-disclaimer { border-top: 0; padding-top: 8px; margin-top: 20px; }

/* ============ HERO: Vollbild ============ */
.hero { padding: 0; min-height: 100svh; min-height: 100vh; position: relative; display: flex; align-items: center; background: var(--bg-2); overflow: hidden; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 72% 20%; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(253,247,239,0.94) 0%, rgba(253,247,239,0.78) 34%, rgba(253,247,239,0) 62%), linear-gradient(180deg, rgba(253,247,239,0) 55%, rgba(253,247,239,0.55) 100%); }
.hero-copy { position: relative; z-index: 2; width: 100%; max-width: 1360px; margin: 0 auto; padding: 110px var(--pad-x) 60px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
.hero-who { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 100px; background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.9); backdrop-filter: blur(8px); font-size: 13px; font-weight: 700; color: var(--ink); }
.hero-who img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.hero h1 { max-width: 13ch; }
.hero h1 em { color: var(--green-dark); }
.hero p.sub { font-size: clamp(16px, 1.3vw, 20px); max-width: 540px; line-height: 1.5; color: var(--ink-2); }
.hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-facts { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; padding-top: 18px; border-top: 1px solid rgba(62,42,32,0.14); }
.hero-facts > span { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.hero-facts svg { width: 16px; height: 16px; color: var(--green-dark); }

/* ============ INTRO-STATEMENT ============ */
.intro { text-align: center; padding-bottom: clamp(40px, 6vh, 72px); }
.intro-inner { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.intro p.big { font-family: var(--display); font-size: clamp(28px, 3.2vw, 48px); line-height: 1.15; letter-spacing: -0.03em; color: var(--ink); font-weight: 300; }
.intro p.big em { font-style: normal; font-weight: 400; color: var(--green-dark); }

/* ============ INNEN & AUSSEN · Vollbild-Split ============ */
.split { padding: 0; }
.split-stage { position: relative; width: 100%; height: clamp(560px, 100vh, 980px); overflow: hidden; background: linear-gradient(90deg, var(--aussen) 50%, var(--innen) 50%); }
.split-stage .cut { position: absolute; left: 50%; bottom: 0; height: 94%; width: auto; max-width: none; transform: translateX(-50%); filter: drop-shadow(-24px 22px 36px rgba(40,10,10,0.38)) drop-shadow(0 6px 12px rgba(40,10,10,0.18)); }
.split-word { position: absolute; top: clamp(72px, 10vh, 110px); z-index: 2; display: flex; flex-direction: column; gap: 6px; }
.split-word.l { left: clamp(20px, 5vw, 80px); color: var(--aussen-deep); }
.split-word.r { right: clamp(20px, 5vw, 80px); color: #fff; text-align: right; align-items: flex-end; }
.split-word b { font-family: var(--display); font-weight: 300; font-size: clamp(56px, 9.5vw, 160px); line-height: 0.95; letter-spacing: -0.04em; }
.split-word small { font-family: var(--mono); font-size: clamp(12px, 1vw, 14px); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; opacity: .85; }
.split-word .pt { max-width: 22ch; font-size: clamp(14px, 1.15vw, 18px); line-height: 1.5; margin-top: 10px; opacity: .92; }
.split-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 1360px; margin: 0 auto; padding: clamp(28px, 4vh, 48px) var(--pad-x) 0; }
.split-col { border-radius: var(--r); padding: clamp(28px, 3.5vw, 52px) clamp(22px, 3.5vw, 52px); display: flex; flex-direction: column; gap: 14px; }
.split-col.l { background: var(--aussen); color: var(--aussen-deep); }
.split-col.r { background: var(--innen); color: #fff; }
.split-col .eye { align-self: flex-start; }
.split-col.l .eye { background: rgba(255,255,255,0.5); border-color: rgba(91,42,16,0.18); color: var(--aussen-deep); }
.split-col h3 { color: inherit; font-size: clamp(26px, 2.6vw, 38px); max-width: 16ch; font-weight: 300; }
.split-col p { color: inherit; opacity: .9; font-size: 16.5px; max-width: 44ch; }
.split-col ul { list-style: none; display: grid; gap: 8px; margin-top: 4px; }
.split-col li { display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; opacity: .92; }
.split-col li b { font-family: var(--mono); font-size: 14px; font-weight: 500; min-width: 26px; }
.split-col.r li b { color: #F2B8A0; }
.split-note { padding: 16px var(--pad-x) 0; max-width: 1360px; margin: 0 auto; }

/* ============ BEAUTY-CHECK ============ */
.check-grid { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: minmax(300px, 480px) 1fr; gap: clamp(28px, 5vw, 80px); align-items: center; }
.check-visual { position: relative; border-radius: var(--r); background: radial-gradient(120% 90% at 50% 100%, var(--green-soft) 0%, var(--bg-2) 70%); padding: 40px 36px 0; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; min-height: 560px; }
.check-visual img.hand { width: 78%; max-width: 380px; height: auto; display: block; transform: translateY(6%); filter: drop-shadow(0 30px 40px rgba(60,30,20,0.25)); }
.check-visual img.selfie { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.check-visual .tag { position: absolute; left: 16px; top: 16px; z-index: 3; }
.check-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.check-copy h2 { max-width: 14ch; }
.check-copy .lead { max-width: 520px; }
.ck-steps { list-style: none; width: 100%; max-width: 560px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 22px; }
.ck-steps li { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
.ck-steps li:last-child { border-bottom: 0; }
.ck-steps i { width: 32px; height: 32px; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); font-style: normal; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center; }
.ck-steps b { display: block; font-weight: 700; color: var(--ink); font-size: 16.5px; }
.ck-steps span { display: block; font-size: 14px; color: var(--ink-2); margin-top: 1px; }
.ck-ctas { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ck-free { font-size: 14px; color: var(--ink-3); }
.ck-note { font-size: 12.5px; color: var(--ink-3); max-width: 520px; }
.ck-then { width: 100%; max-width: 560px; margin-top: 6px; padding: 18px 22px; border-radius: var(--r-sm); background: var(--green-soft); color: var(--green-deep); font-size: 15px; line-height: 1.5; }
.ck-then b { font-weight: 700; }
.ck-then a { font-weight: 700; border-bottom: 1px solid currentColor; }

/* ============ PRODUKTE ============ */
.products { background: var(--paper); padding-top: 0; }
.pr-stage { position: relative; margin: 0 calc(-1 * var(--pad-x)); background: var(--paper); overflow: hidden; }
.pr-stage > img { width: 100%; height: auto; display: block; }
.pr-stage::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, var(--paper) 0%, rgba(255,252,248,0) 22%), linear-gradient(180deg, rgba(255,252,248,0) 78%, var(--paper) 100%); pointer-events: none; }
.pr-stage .s-head { position: absolute; left: var(--pad-x); right: var(--pad-x); top: 7%; z-index: 2; margin: 0 auto; }
.pr-rows { max-width: 1040px; margin: -40px auto 0; position: relative; z-index: 2; display: grid; gap: 10px; }
.pr-row { display: grid; grid-template-columns: 84px 1fr auto; gap: 20px; align-items: center; width: 100%; text-align: left; padding: 16px 20px 16px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); transition: border-color .2s, transform .2s var(--ease); }
.pr-row:hover { border-color: var(--line-2); transform: translateY(-1px); }
.pr-row img { width: 84px; height: 84px; border-radius: var(--r-xs); object-fit: cover; }
.pr-row .t { display: flex; flex-direction: column; gap: 3px; }
.pr-row .t b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 1.8vw, 26px); letter-spacing: -0.02em; color: var(--ink); line-height: 1.1; }
.pr-row .t span { font-size: 14.5px; color: var(--ink-2); }
.pr-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
.pr-meta i { display: inline-flex; align-items: center; gap: 5px; font-style: normal; font-weight: 600; color: var(--green-dark); }
.pr-meta svg { width: 15px; height: 15px; }
.pr-meta em { font-style: normal; color: var(--ink-3); }
.pr-row .more { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); color: var(--ink); background: var(--paper); font-size: 22px; line-height: 1; }
.pr-sub { max-width: 1040px; margin: clamp(36px, 5vh, 56px) auto 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.pr-sub h3 { font-size: clamp(28px, 2.6vw, 38px); }
.pr-sub span { font-size: 14.5px; color: var(--ink-3); }
.pr-cards { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.pr-cards.three { grid-template-columns: repeat(3, 1fr); }
.pr-card { position: relative; border-radius: var(--r-sm); overflow: hidden; background: var(--bg); border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; transition: border-color .2s, transform .2s var(--ease); }
.pr-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
.pr-card .im { aspect-ratio: 1 / 1; overflow: hidden; background: var(--bg-2); }
.pr-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.pr-card:hover img { transform: scale(1.04); }
.pr-card .cap { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px; }
.pr-card b { font-weight: 700; font-size: 15px; line-height: 1.25; color: var(--ink); }
.pr-card .cap span { font-size: 12.5px; color: var(--ink-3); }
.pr-card .chip { position: absolute; top: 10px; left: 10px; z-index: 2; padding: 5px 9px; border-radius: 100px; background: rgba(255,255,255,0.88); color: var(--ink); font-size: 11px; font-weight: 700; }
.pr-cta { max-width: 1040px; margin: clamp(40px, 6vh, 64px) auto 0; grid-template-columns: 1fr 220px !important; padding: clamp(26px, 3.5vw, 44px) !important; background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 55%), radial-gradient(90% 90% at 0% 100%, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 60%), radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--green-deep); color: #fff; border-radius: var(--r); padding: clamp(28px, 4vw, 52px); display: grid; grid-template-columns: 1.2fr minmax(240px, 300px); gap: 40px; align-items: center; overflow: hidden; }
.pr-cta-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.pr-cta h3 { color: #fff; font-size: clamp(28px, 2.8vw, 40px); max-width: 16ch; line-height: 1.08; font-weight: 300; }
.pr-cta h3 em { color: var(--accent); }
.pr-cta p { color: rgba(255,255,255,0.8); font-size: 16px; max-width: 440px; }
.pr-cta-who { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.pr-cta-who img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.18); margin-bottom: 10px; box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6); }
.pr-cta-who b { font-size: 16px; font-weight: 600; }
.pr-cta-who span { font-size: 13px; color: rgba(255,255,255,0.7); }
.pr-note { max-width: 1040px; margin: 16px auto 0; }
.link-more { font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--line-2); padding-bottom: 1px; }

/* Produkt-Fenster */
.pm-modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.pm-modal.open { display: flex; }
.pm-modal-bg { position: absolute; inset: 0; background: rgba(30, 15, 10, 0.5); backdrop-filter: blur(4px); }
.pm-sheet { position: relative; z-index: 1; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; background: var(--paper); border-radius: 28px 28px 0 0; padding: 30px 26px calc(28px + env(safe-area-inset-bottom)); animation: sheetUp .3s var(--ease); }
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.pm-close { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.pm-close svg { width: 18px; height: 18px; }
.pm-head { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; padding-right: 44px; margin-bottom: 16px; }
.pm-head img { width: 96px; height: 96px; border-radius: var(--r-sm); object-fit: cover; }
.pm-tag { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; color: var(--ink-3); margin-bottom: 6px; display: block; }
.pm-sheet h3 { font-size: clamp(24px, 2.6vw, 30px); margin-bottom: 4px; }
.pm-price { font-size: 14.5px; color: var(--ink-3); }
.pm-price strong { color: var(--ink); font-weight: 600; font-size: 16px; }
.pm-desc { font-size: 15.5px; }
.pm-pros { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.pm-pros li::before { content: '✓' !important; color: var(--green-dark); }
.pm-two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.pm-actions { flex-direction: column; align-items: flex-start; gap: 10px; }
.pm-note { font-size: 13px; color: var(--ink-2); max-width: 520px; }
@media (max-width: 600px) { .pm-pros, .pm-two { grid-template-columns: 1fr; } }
.pm-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.pm-fact { background: var(--bg); border-radius: var(--r-xs); padding: 12px 14px; }
.pm-fact small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; font-weight: 500; }
.pm-fact span { font-size: 14.5px; color: var(--ink); }
.pm-block { margin-top: 18px; }
.pm-block h4 { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.pm-block p, .pm-block li { font-size: 15.5px; line-height: 1.55; color: var(--ink-2); }
.pm-block ul { list-style: none; display: grid; gap: 6px; }
.pm-block li { display: flex; gap: 9px; }
.pm-block li::before { content: '–'; color: var(--green-dark); flex-shrink: 0; }
.pm-actives { display: flex; flex-wrap: wrap; gap: 6px; }
.pm-actives span { padding: 6px 11px; border-radius: 100px; background: var(--green-soft); color: var(--green-dark); font-size: 13px; font-weight: 600; }
.pm-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
.pm-src { margin-top: 16px; }
@media (min-width: 720px) { .pm-modal { align-items: center; padding: 24px; } .pm-sheet { border-radius: 28px; padding: 36px 36px 32px; } }

/* ============ MÄNNER ============ */
.men { padding: 0; background: #2B2623; color: #fff; }
.men-stage { position: relative; height: clamp(480px, 70vh, 760px); overflow: hidden; }
.men-stage > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 20% 30%; }
.men-stage::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(43,38,35,0) 40%, rgba(43,38,35,0.35) 100%); }
.men-copy { position: absolute; z-index: 2; right: clamp(20px, 6vw, 96px); top: 50%; transform: translateY(-50%); width: min(560px, 50%); display: grid; grid-template-columns: 1fr 200px; gap: 28px; align-items: center; }
.men-copy h2 { color: #fff; font-size: clamp(36px, 4vw, 58px); }
.men-copy h2 em { color: #E8C9A6; }
.men-copy p { color: rgba(255,255,255,0.82); font-size: 16px; max-width: 34ch; }
.men-text { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.men-prod { background: #fff; border-radius: var(--r); overflow: hidden; text-align: left; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6); display: flex; flex-direction: column; color: var(--ink); }
.men-prod img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
.men-prod span { padding: 12px 14px 14px; font-size: 13px; color: var(--ink-2); }
.men-prod span b { display: block; font-weight: 700; font-size: 15px; color: var(--ink); }

/* ============ VORTEILE · Bento ============ */
.bento { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(240px, auto); gap: 14px; }
.bento-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 26px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.bento-card.tall { grid-row: span 2; }
.bento-card.wide { grid-column: span 2; }
.bento-card .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; color: var(--ink-3); }
.bento-card h3 { max-width: 18ch; }
.bento-card p { font-size: 15px; line-height: 1.5; max-width: 480px; }
.bento-card.photo { padding: 0; justify-content: flex-end; min-height: 340px; color: #fff; border: 0; }
.bento-card.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bento-card.photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,15,10,0) 30%, rgba(30,15,10,0.76) 100%); }
.bento-over { position: relative; z-index: 2; padding: 26px; display: flex; flex-direction: column; gap: 8px; }
.bento-card.photo .eyebrow { color: rgba(255,255,255,0.78); }
.bento-card.photo h3 { color: #fff; }
.bento-card.photo p { color: rgba(255,255,255,0.88); }
.bento-card.stat { justify-content: center; }
.bento-card .big { font-family: var(--display); font-weight: 300; font-size: clamp(64px, 6.5vw, 100px); line-height: 0.95; letter-spacing: -0.04em; color: var(--green-dark); }
.bento-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.bento-chips span { padding: 8px 13px; border-radius: 100px; background: var(--green-soft); color: var(--green-deep); font-size: 14px; font-weight: 600; }
.bento-card.sand { background: var(--bg-2); border-color: transparent; }
.guar-badge { width: 104px; height: 104px; border-radius: 50%; border: 1.5px solid var(--green-dark); color: var(--green-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 8px; }
.guar-badge b { font-family: var(--display); font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -0.03em; }
.guar-badge span { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
/* Für jede Haut: vier Gesichter */
.bento-card.faces { padding: 0; border: 0; background: var(--bg-2); min-height: 340px; justify-content: flex-end; }
.faces-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
.faces-grid img { width: 100%; height: 100%; object-fit: cover; }
.bento-card.faces::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,15,10,0) 22%, rgba(30,15,10,0.5) 52%, rgba(30,15,10,0.9) 100%); }
.bento-card.faces .bento-over { text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
.bento-card.faces h3 { max-width: 22ch; }
.bento-card.faces p { max-width: 560px; }
.bento-card.faces .bento-over { color: #fff; }
.bento-card.faces .eyebrow { color: rgba(255,255,255,0.78); }
.bento-card.faces h3 { color: #fff; }
.bento-card.faces p { color: rgba(255,255,255,0.88); }

/* ============ ÜBER MICH ============ */
.about { background: var(--bg-2); }
.about-grid { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: minmax(300px, 520px) 1fr; gap: clamp(28px, 5vw, 80px); align-items: center; }
.about-photo { position: relative; aspect-ratio: 4 / 5; border-radius: var(--r); overflow: hidden; background: var(--paper); }
.about-photo img { width: 100%; height: 100%; object-fit: cover; }
.about-photo .cap { position: absolute; left: 14px; right: 14px; bottom: 14px; padding: 14px 16px; border-radius: var(--r-sm); background: rgba(40,20,15,0.42); backdrop-filter: blur(10px); color: #fff; }
.about-photo .cap b { display: block; font-weight: 500; font-size: 18px; }
.about-photo .cap span { font-size: 13px; opacity: .85; }
.about-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.about-copy h2 .accent, .about-copy h2 em { font-style: italic; color: var(--green-dark); }
.about-text p { font-size: 16.5px; margin-bottom: 12px; max-width: 560px; }
.about-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.about-pills span { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 100px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink); }
.about-pills svg { width: 15px; height: 15px; color: var(--green-dark); }

/* ============ ROUTINE ============ */
.rt-cols { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rt-col { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 26px 14px; }
.rt-col h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.rt-col h3 .t { font-family: var(--font); font-size: 13px; color: var(--ink-3); font-weight: 600; }
.rt-step { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.rt-step:last-child { border-bottom: 0; }
.rt-step i { width: 28px; height: 28px; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); font-style: normal; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.rt-step b { font-weight: 700; font-size: 16px; color: var(--ink); }
.rt-step small { font-size: 13px; color: var(--ink-3); text-align: right; }

/* ============ KONTAKT · 3 Schritte ============ */
.contact { background: var(--green-deep); color: #fff; }
.contact .s-head h2 { color: #fff; }
.contact .s-head h2 strong { font-weight: 500; font-style: italic; color: var(--accent); }
.contact .s-head p { color: rgba(255,255,255,0.78); }
.cform { background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 30px; max-width: 640px; margin: 0 auto; }
.f-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 26px; }
.f-progress span { height: 4px; border-radius: 100px; background: var(--bg-2); }
.f-progress span.on { background: var(--green); }
.f-step { display: none; }
.f-step.on { display: block; animation: stepIn .3s var(--ease); }
@keyframes stepIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
.f-step h3 { text-align: center; margin-bottom: 6px; }
.f-hint { text-align: center; font-size: 14px; color: var(--ink-3); margin-bottom: 20px; }
.f-opts { display: grid; gap: 10px; margin-top: 18px; }
.f-opts-grid { grid-template-columns: 1fr 1fr; }
.f-opt { text-align: left; padding: 16px 18px 16px 48px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); position: relative; transition: all .15s; }
.f-opt::before { content: ''; position: absolute; left: 16px; top: 18px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--paper); transition: all .15s; }
.f-opt.on { background: var(--green-soft); border-color: var(--green); }
.f-opt.on::before { background: var(--green); border-color: var(--green); box-shadow: inset 0 0 0 3px var(--paper); }
.f-opt b { display: block; font-weight: 700; font-size: 15px; color: var(--ink); }
.f-opt > span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.f-opts-grid .f-opt { padding: 14px 14px 14px 44px; }
.f-opts-grid .f-opt::before { top: 15px; left: 14px; }
.f-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; }
.f-back { font-size: 14px; font-weight: 600; color: var(--ink-3); padding: 10px 0; }
.f-back:hover { color: var(--ink); }
.f-nav .btn[disabled] { opacity: .45; cursor: not-allowed; }
.cform .f-row { margin-bottom: 12px; }
.cform input[type="text"], .cform input[type="email"], .cform input[type="tel"] { width: 100%; font: inherit; font-size: 16px; padding: 14px 16px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; }
.cform input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); background: var(--paper); }
.f-label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 4px 0 8px; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { padding: 11px 8px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg); font-size: 14px; font-weight: 600; color: var(--ink-2); text-align: center; transition: all .15s; }
.chip.on { background: var(--green-soft); border-color: var(--green); color: var(--green-deep); }
.f-check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); margin-top: 14px; cursor: pointer; }
.f-check input { margin-top: 3px; accent-color: var(--green); width: 16px; height: 16px; }
.cform-ok { display: none; text-align: center; padding: 20px 6px; }
.cform.sent form, .cform.sent .f-progress { display: none; }
.cform.sent .cform-ok { display: block; }
.ok-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.ok-ico svg { width: 26px; height: 26px; }
.cform-ok h3 { margin-bottom: 8px; }
.cform-ok p { font-size: 15.5px; }
.contact-card { max-width: 640px; margin: 14px auto 0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: var(--r); padding: 16px 18px; display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; }
.contact-card img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.contact-card b { display: block; font-weight: 700; font-size: 15.5px; }
.contact-card > div > span { display: block; font-size: 13px; color: rgba(255,255,255,0.65); }
.contact-card-btns { display: flex; gap: 8px; }
.contact-card-btns a { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.22); font-size: 13.5px; font-weight: 700; color: #fff; }
.contact-card-btns svg { width: 15px; height: 15px; }
.contact-shop { max-width: 640px; margin: 26px auto 0; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.14); display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
.contact-shop p { color: rgba(255,255,255,0.72); font-size: 14.5px; max-width: 420px; }
.contact-shop a { color: #fff; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.4); padding-bottom: 2px; white-space: nowrap; }

/* ============ RESPONSIVE ============ */
@media (max-width: 1024px) {
  .hero > img { object-position: 68% 10%; }
  .hero::after { background: linear-gradient(180deg, rgba(253,247,239,0) 32%, rgba(253,247,239,0.9) 68%); }
  .split-stage { height: auto; aspect-ratio: 3 / 4; }
  .split-stage .cut { height: 80%; }
  .split-word b { font-size: clamp(48px, 13vw, 96px); }
  .split-word .pt { display: none; }
  .split-cols { grid-template-columns: 1fr; }
  .check-grid { grid-template-columns: 1fr; }
  .check-visual { max-width: 480px; min-height: 480px; }
  .pr-cards { grid-template-columns: repeat(3, 1fr); }
  .pr-cta { grid-template-columns: 1fr !important; }
  .pr-cta-who { flex-direction: row; text-align: left; gap: 2px 14px; flex-wrap: wrap; }
  .pr-cta-who img { width: 72px; height: 72px; margin: 0; }
  .pr-cta-who b { width: calc(100% - 90px); }
  .men-stage { height: auto; }
  .men-stage > img { position: relative; height: auto; aspect-ratio: 4 / 3; object-position: 30% 20%; }
  .men-stage::after { display: none; }
  .men-copy { position: static; transform: none; width: auto; padding: 28px var(--pad-x) 40px; grid-template-columns: 1fr 180px; }
  .bento { grid-template-columns: 1fr 1fr; }
  .bento-card.wide { grid-column: span 2; }
  .bento-card.tall { grid-row: span 1; min-height: 360px; }
  .about-grid { grid-template-columns: 1fr; }
  .about-photo { max-width: 440px; }
}
@media (max-width: 760px) {
  section { padding: 56px var(--pad-x); }
  .hero { min-height: 0; align-items: stretch; flex-direction: column; background: var(--bg); }
  .hero > img { position: relative; height: auto; aspect-ratio: 4 / 4.6; object-position: 60% 15%; margin-top: 64px; }
  .hero::after { display: none; }
  .hero-copy { padding: 22px var(--pad-x) 32px; gap: 14px; }
  .hero h1 { font-size: clamp(46px, 13vw, 60px); }
  .hero-facts { gap: 10px 18px; }
  .hero-ctas { flex-direction: column; align-items: stretch; width: 100%; }
  .hero-ctas .btn { justify-content: center; }
  .split-stage { aspect-ratio: 3 / 4; }
  .split-stage .cut { height: 72%; }
  .split-word { top: 18px; }
  .split-word.l { left: 18px; } .split-word.r { right: 18px; }
  .split-word b { font-size: clamp(40px, 12vw, 60px); }
  .split-word small { font-size: 11px; }
  .split-col { padding: 26px 20px; }
  .split-cols { padding-top: 14px; }
  .check-visual { min-height: 0; padding: 28px 24px 0; }
  .check-visual img.hand { width: 82%; }
  .pr-stage { display: flex; flex-direction: column; padding-top: 48px; }
  .pr-stage .s-head { position: static; order: -1; padding: 0 var(--pad-x) 8px; }
  .pr-stage > img { aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 100%; }
  .pr-stage::before { display: none; }
  .pr-rows { margin-top: -24px; }
  .pr-row { grid-template-columns: 64px 1fr; }
  .pr-row img { width: 64px; height: 64px; }
  .pr-row .more { display: none; }
  .pr-cards, .pr-cards.three { grid-template-columns: repeat(2, 1fr); }
  .men-copy { grid-template-columns: 1fr; }
  .men-prod { max-width: 220px; }
  .bento { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .bento-card, .bento-card.wide, .bento-card.tall { grid-column: span 1; grid-row: span 1; }
  .faces-grid { grid-template-columns: 1fr 1fr; }
  .bento-card.faces { min-height: 520px; }
  .bento-card.faces::after { background: linear-gradient(180deg, rgba(30,15,10,0) 45%, rgba(30,15,10,0.85) 100%); }
  .rt-cols { grid-template-columns: 1fr; }
