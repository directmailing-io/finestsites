<!DOCTYPE html>
<html lang="de" data-theme="{{farbthema}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schönheit von innen &amp; außen · {{vorname}}</title>
<meta name="description" content="Eine einfache Pflege-Routine von außen, ein Glas am Tag von innen. Beauty-Check mit {{vorname}}: kostenlos, unverbindlich, persönlich.">
<meta name="theme-color" content="#F9F3F1">

<!-- Sprache früh setzen — verhindert Flackern beim ersten Layout-Paint. -->
<script>
(function(){
  try {
    var stored = localStorage.getItem('fs-lang');
    var lang = stored || (navigator.language && navigator.language.toLowerCase().startsWith('en') ? 'en' : 'de');
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang);
  } catch(e) {
    document.documentElement.setAttribute('data-lang', 'de');
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/hero/{{hero_variante}}.webp" fetchpriority="high" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
:root {
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --pad-x: clamp(20px, 5vw, 64px);
  --max: 1200px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ============ FARBTHEMEN — 4 Varianten + eigene Farbe ============ */
/* Variablennamen wie im cellRESET-Template (--green = Primärfarbe), damit Leiste, Formular und Fußzeile 1:1 passen */
html[data-theme="rose"], html:not([data-theme]), html[data-theme=""] {
  --bg: #F9F3F1; --bg-2: #F1E4E0; --paper: #FFFCFB;
  --ink: #2A1F1E; --ink-2: #5A4A47; --ink-3: #9A8783;
  --line: #E9DAD5; --line-2: #D8C5BF;
  --green: #C26A72; --green-dark: #A8545C; --green-soft: #F6E1E2; --green-deep: #4A2229;
  --accent: #E2B8A4;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="sand"] {
  --bg: #F8F4EE; --bg-2: #EFE6DA; --paper: #FFFDFA;
  --ink: #2B2420; --ink-2: #5A4E45; --ink-3: #9A8C7F;
  --line: #E8DDCF; --line-2: #D6C7B5;
  --green: #B88A5A; --green-dark: #9C7246; --green-soft: #F3E6D6; --green-deep: #4A3620;
  --accent: #D9B98F;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="salbei"] {
  --bg: #F2F5F1; --bg-2: #E4EBE3; --paper: #FBFDFA;
  --ink: #1E2A24; --ink-2: #44554C; --ink-3: #8A9A91;
  --line: #D7E2D9; --line-2: #BFCFC3;
  --green: #7B9A86; --green-dark: #5F7F6B; --green-soft: #E2EDE5; --green-deep: #27403A;
  --accent: #C9D8C2;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="pflaume"] {
  --bg: #F6F1F5; --bg-2: #ECE1EA; --paper: #FDFBFD;
  --ink: #2A1E2A; --ink-2: #56455A; --ink-3: #978A99;
  --line: #E5D8E2; --line-2: #D2C1CE;
  --green: #8A4A72; --green-dark: #6F3759; --green-soft: #F0E0EC; --green-deep: #3B1F34;
  --accent: #D7B6CE;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="eigene"] {
  --bg: var(--fs-paper-2); --bg-2: var(--fs-paper-3); --paper: var(--fs-surface);
  --ink: var(--fs-ink); --ink-2: var(--fs-ink-2); --ink-3: var(--fs-ink-3);
  --line: var(--fs-line); --line-2: var(--fs-ink-3);
  --green: var(--fs-primary); --green-dark: var(--fs-primary-hover); --green-soft: var(--fs-tint); --green-deep: var(--fs-dark-1);
  --accent: var(--fs-bright);
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="eigene"] .conversion h2 em, html[data-theme="eigene"] .conversion h2 .mark { color: var(--fs-bright); }
html[data-theme="eigene"] .conversion .section-tag { background: rgba(255,255,255,0.16); color: #fff; border-color: rgba(255,255,255,0.28); }

/* ============ BASIS ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
h1, h2, h3 { font-weight: 600; letter-spacing: -0.025em; line-height: 1.08; color: var(--ink); }
h1 { font-size: clamp(42px, 5.4vw, 68px); font-weight: 600; }
h2 { font-size: clamp(32px, 4vw, 50px); }
h3 { font-size: clamp(20px, 2vw, 24px); line-height: 1.25; }
.mark { color: var(--green-dark); }
p { color: var(--ink-2); }
.arr { display: inline-block; transition: transform .2s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.wrap { max-width: var(--max); margin: 0 auto; }
.narrow { max-width: 760px; margin-left: auto; margin-right: auto; }
.lead { font-size: clamp(17px, 1.4vw, 19px); line-height: 1.6; color: var(--ink-2); }
.foot-note { font-size: 13px; line-height: 1.55; color: var(--ink-3); }

/*@@REUSE_CSS@@*/

/* Übernommene Blöcke: eigene Rundungs-Regeln neutralisieren (Beauty setzt Abschnitte flach aufeinander) */
.about-section, .faq-section { margin-top: 0; box-shadow: none; }
.section-tag { background: var(--green-soft); color: var(--green-deep); }

/* ============ HERO ============ */
.hero {
  padding: clamp(120px, 16vh, 160px) var(--pad-x) clamp(80px, 12vh, 120px);
  position: relative; overflow: hidden; min-height: 92vh;
  display: flex; align-items: center;
  background: linear-gradient(180deg, var(--paper) 0%, var(--bg) 35%, var(--bg-2) 100%);
}
.hero-bg-image { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.hero-bg-image img { width: 100%; height: 100%; object-fit: cover; object-position: right center; }
.hero-bg-image::before {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, var(--bg-2) 0%, var(--bg-2) 22%,
    color-mix(in oklab, var(--bg-2) 88%, transparent) 42%,
    color-mix(in oklab, var(--bg-2) 40%, transparent) 62%,
    color-mix(in oklab, var(--bg-2) 0%, transparent) 82%);
}
.hero-bg-image::after {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: multiply;
  background: linear-gradient(90deg, transparent 0%, transparent 60%, color-mix(in oklab, var(--green-soft) 30%, transparent) 100%);
}
.ai-badge { position: absolute; bottom: 24px; right: 24px; z-index: 2; pointer-events: auto; filter: drop-shadow(0 2px 8px rgba(255,255,255,0.5)); }
.ai-badge img { height: 44px; width: auto; display: block; }
.hero-inner { max-width: var(--max); margin: 0 auto; width: 100%; position: relative; z-index: 2; }
.hero-content { max-width: 640px; }
.hero-pill {
  display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 100px;
  font-size: 13px; color: var(--ink); margin-bottom: 28px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.hero-pill .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; display: inline-block; box-shadow: 0 0 0 4px color-mix(in oklab, var(--green) 20%, transparent); flex-shrink: 0; }
.hero h1 { max-width: 600px; margin-bottom: 22px; }
.hero p.sub { font-size: clamp(17px, 1.35vw, 19px); color: var(--ink-2); max-width: 560px; margin-bottom: 34px; line-height: 1.55; }
.hero-ctas { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 34px; }
.hero-signals { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding-top: 22px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.hero-signal { display: inline-flex; align-items: center; gap: 8px; }
.hero-signal .ico { width: 18px; height: 18px; color: var(--green-dark); }
.hero-signals .sep { width: 1px; height: 14px; background: var(--line-2); }
@media (max-width: 900px) { .hero-bg-image::before { background: linear-gradient(180deg, transparent 40%, var(--bg) 100%); } }

/* ============ INNEN & AUSSEN ============ */
.duo { background: var(--paper); }
.duo-head { max-width: 760px; margin: 0 auto 48px; text-align: center; }
.duo-head p { margin-top: 18px; }
.duo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; position: relative; max-width: 1080px; margin: 0 auto; }
.duo-card { position: relative; border-radius: 28px; overflow: hidden; background: var(--bg-2); min-height: 520px; display: flex; flex-direction: column; justify-content: flex-end; }
.duo-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.duo-card:hover img { transform: scale(1.03); }
.duo-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(20, 10, 12, 0.62) 100%); }
.duo-body { position: relative; z-index: 2; padding: 30px 30px 30px; color: #fff; }
.duo-kicker { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 12px; border-radius: 100px; background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); margin-bottom: 14px; }
.duo-body h3 { color: #fff; font-size: clamp(24px, 2.6vw, 32px); margin-bottom: 10px; }
.duo-body p { color: rgba(255,255,255,0.86); font-size: 16px; max-width: 420px; }
.duo-body ul { list-style: none; margin-top: 16px; display: grid; gap: 7px; }
.duo-body li { display: flex; align-items: flex-start; gap: 9px; color: rgba(255,255,255,0.92); font-size: 15px; }
.duo-body li::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex-shrink: 0; }
.duo-amp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; width: 72px; height: 72px; border-radius: 50%; background: var(--paper); color: var(--green-dark); font-size: 34px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px -8px rgba(0,0,0,0.3); border: 4px solid var(--paper); }
.duo-bridge { max-width: 760px; margin: 44px auto 0; text-align: center; }
.duo-bridge p { font-size: clamp(18px, 1.6vw, 22px); color: var(--ink); line-height: 1.5; }
.duo-bridge .foot-note { margin-top: 18px; }

/* ============ ROUTINE ============ */
.routine { background: var(--bg); }
.routine-head { max-width: 760px; margin: 0 auto 36px; text-align: center; }
.routine-head p { margin-top: 18px; }
.rt-toggle { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 100px; padding: 4px; margin: 0 auto 36px; gap: 2px; }
.rt-toggle button { padding: 11px 22px; border-radius: 100px; font-size: 15px; font-weight: 600; color: var(--ink-2); transition: background .2s, color .2s; display: inline-flex; align-items: center; gap: 8px; }
.rt-toggle button.on { background: var(--ink); color: var(--paper); }
.rt-toggle svg { width: 16px; height: 16px; }
.routine-stage { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
.rt-visual { position: relative; border-radius: 28px; overflow: hidden; min-height: 440px; background: var(--bg-2); }
.rt-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s var(--ease); }
.rt-visual img.night { opacity: 0; }
.routine-stage[data-mode="abend"] .rt-visual img.night { opacity: 1; }
.routine-stage[data-mode="abend"] .rt-visual img.day { opacity: 0; }
.rt-time { position: absolute; left: 22px; top: 22px; z-index: 2; padding: 8px 14px; border-radius: 100px; background: rgba(255,255,255,0.86); backdrop-filter: blur(8px); font-size: 13px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
.rt-list { background: var(--paper); border: 1px solid var(--line); border-radius: 28px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.rt-step { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 14px 14px; border-radius: 18px; transition: background .2s; align-items: start; }
.rt-step:hover { background: var(--bg); }
.rt-step[data-when] { display: none; }
.routine-stage[data-mode="morgen"] .rt-step[data-when~="morgen"], .routine-stage[data-mode="abend"] .rt-step[data-when~="abend"] { display: grid; }
.rt-num { width: 44px; height: 44px; border-radius: 50%; background: var(--green-soft); color: var(--green-deep); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.rt-step.in .rt-num { background: var(--green-deep); color: #fff; }
.rt-step b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
.rt-step small { display: block; font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green-dark); margin: 2px 0 4px; }
.rt-step p { font-size: 14.5px; line-height: 1.5; }
.rt-sum { margin-top: 8px; padding: 14px 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.rt-sum svg { width: 18px; height: 18px; color: var(--green-dark); flex-shrink: 0; }

/* ============ BEAUTY-CHECK ============ */
.check { background: var(--paper); }
.check-grid { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
.check-img { border-radius: 28px; overflow: hidden; aspect-ratio: 4 / 3; position: relative; background: var(--bg-2); }
.check-img img { width: 100%; height: 100%; object-fit: cover; }
.check-img .ai-badge { bottom: 16px; right: 16px; }
.check-copy h2 { margin: 14px 0 16px; }
.check-copy .lead { margin-bottom: 26px; }
.ck-steps { list-style: none; display: grid; gap: 12px; margin-bottom: 26px; }
.ck-step { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; padding: 16px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); }
.ck-step .n { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.ck-step b { display: block; font-size: 16.5px; color: var(--ink); margin-bottom: 2px; }
.ck-step p { font-size: 14.5px; line-height: 1.5; }
.ck-scan { margin: 0 0 26px; padding: 18px 20px; border-radius: 18px; background: var(--green-soft); border: 1px solid color-mix(in oklab, var(--green) 25%, transparent); }
.ck-scan b { display: block; color: var(--green-deep); font-size: 15.5px; margin-bottom: 4px; }
.ck-scan p { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.ck-scan .foot-note { margin-top: 8px; }
.ck-ctas { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ck-note { margin-top: 16px; font-size: 13.5px; color: var(--ink-3); }

/* ============ VORTEILE (6 Gründe) ============ */
.why { background: var(--bg); }
.why-head { max-width: 760px; margin: 0 auto 44px; text-align: center; }
.why-head p { margin-top: 18px; }
.why-grid { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.why-card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 26px 24px; display: flex; flex-direction: column; gap: 10px; min-height: 210px; transition: transform .25s var(--ease), box-shadow .25s; }
.why-card:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -20px rgba(0,0,0,0.18); }
.why-card.wide { grid-column: span 2; background: var(--green-deep); color: #fff; border-color: transparent; }
.why-card.wide b, .why-card.wide p { color: #fff; }
.why-card.wide p { color: rgba(255,255,255,0.82); }
.why-card .n { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--green-dark); }
.why-card.wide .n { color: var(--accent); }
.why-card b { font-size: clamp(19px, 1.7vw, 22px); font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; color: var(--ink); }
.why-card p { font-size: 15px; line-height: 1.55; }
.why-card .ico { width: 36px; height: 36px; border-radius: 12px; background: var(--green-soft); color: var(--green-deep); display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
.why-card.wide .ico { background: rgba(255,255,255,0.14); color: #fff; }
.why-card .ico svg { width: 19px; height: 19px; }

/* ============ PRODUKTE ============ */
.products { background: var(--paper); }
.pr-head { max-width: 760px; margin: 0 auto 32px; text-align: center; }
.pr-head p { margin-top: 18px; }
.pr-tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 34px; }
.pr-tab { padding: 10px 18px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg); font-size: 14.5px; font-weight: 600; color: var(--ink-2); transition: all .2s; }
.pr-tab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pr-group { display: none; max-width: 1080px; margin: 0 auto; }
.pr-group.on { display: block; }
.pr-intro { text-align: center; max-width: 620px; margin: 0 auto 26px; font-size: 15.5px; }
.pr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.pc { background: var(--bg); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; transition: transform .25s var(--ease), box-shadow .25s; }
.pc:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -20px rgba(0,0,0,0.2); }
.pc-img { aspect-ratio: 4 / 3; background: linear-gradient(160deg, var(--bg-2), var(--green-soft)); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pc-img img { width: 100%; height: 100%; object-fit: cover; }
.pc-img .ph { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--green-dark); }
.pc-img .ph svg { width: 44px; height: 44px; opacity: .6; }
.pc-img.noimg img { display: none; }
.pc-img.noimg .ph { display: flex; }
.pc-tag { position: absolute; left: 14px; top: 14px; padding: 5px 11px; border-radius: 100px; background: rgba(255,255,255,0.9); font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green-deep); }
.pc-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pc-body b { font-size: 17.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.2; }
.pc-body p { font-size: 14.5px; line-height: 1.5; flex: 1; }
.pc-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-3); }
.pc-meta strong { color: var(--ink); font-weight: 600; font-size: 15px; }
.pc-actions { display: flex; gap: 8px; margin-top: 6px; }
.pc-actions .btn { padding: 10px 14px; font-size: 14px; flex: 1; justify-content: center; }
.pr-note { max-width: 760px; margin: 28px auto 0; text-align: center; }

/* Produkt-Fenster */
.pm-modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: flex-end; justify-content: center; padding: 0; }
.pm-modal.open { display: flex; }
.pm-modal-bg { position: absolute; inset: 0; background: rgba(20, 10, 12, 0.5); backdrop-filter: blur(4px); }
.pm-sheet { position: relative; z-index: 1; width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; background: var(--paper); border-radius: 28px 28px 0 0; padding: 28px 26px calc(28px + env(safe-area-inset-bottom)); animation: sheetUp .3s var(--ease); }
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.pm-close { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.pm-close svg { width: 18px; height: 18px; }
.pm-sheet .pc-tag { position: static; display: inline-block; margin-bottom: 12px; background: var(--green-soft); }
.pm-sheet h3 { font-size: clamp(24px, 3vw, 30px); margin-bottom: 6px; padding-right: 48px; }
.pm-price { font-size: 15px; color: var(--ink-3); margin-bottom: 18px; }
.pm-price strong { color: var(--ink); font-weight: 600; }
.pm-block { margin-top: 18px; }
.pm-block h4 { font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green-dark); margin-bottom: 8px; }
.pm-block p, .pm-block li { font-size: 15px; line-height: 1.55; color: var(--ink-2); }
.pm-block ul { list-style: none; display: grid; gap: 6px; }
.pm-block li { display: flex; gap: 9px; }
.pm-block li::before { content: '✓'; color: var(--green-dark); font-weight: 700; flex-shrink: 0; }
