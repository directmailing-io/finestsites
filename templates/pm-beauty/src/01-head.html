<!DOCTYPE html>
<html lang="de" data-theme="{{farbthema}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schönheit von innen &amp; außen · {{vorname}}</title>
<meta name="description" content="Eine einfache Pflege-Routine von außen, ein Glas am Tag von innen. Beauty-Check mit {{vorname}}: kostenlos, unverbindlich, persönlich.">
<meta name="theme-color" content="#F9F3F1">

<!-- Sprache früh setzen — verhindert Flackern beim ersten Layout-Paint. -->
<script>
(function(){
  try {
    var stored = localStorage.getItem('fs-lang');
    var lang = stored || (navigator.language && navigator.language.toLowerCase().startsWith('en') ? 'en' : 'de');
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang);
  } catch(e) {
    document.documentElement.setAttribute('data-lang', 'de');
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/hero/{{hero_variante}}.webp" fetchpriority="high" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

<style>
:root {
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display: 'Jost', 'Futura', 'Avenir Next', sans-serif;
  --r: 28px; --r-sm: 18px;
  --pad-x: clamp(20px, 5vw, 72px);
  --max: 1240px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ============ FARBTHEMEN — 4 Varianten + eigene Farbe ============ */
/* Variablennamen wie in den anderen Templates (--green = Primärfarbe), damit Leiste, Kontakt-Fenster und Fußzeile passen */
html[data-theme="rose"], html:not([data-theme]), html[data-theme=""] {
  --bg: #F9F4F1; --bg-2: #F1E6E1; --paper: #FFFDFC;
  --ink: #241A19; --ink-2: #5B4B48; --ink-3: #9B8A86;
  --line: #E8DBD6; --line-2: #D7C6C0;
  --green: #B9636B; --green-dark: #9E4F57; --green-soft: #F5E3E3; --green-deep: #3F1E22;
  --accent: #D9A79A;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="sand"] {
  --bg: #F8F4EE; --bg-2: #EFE6DA; --paper: #FFFDFA;
  --ink: #2B2420; --ink-2: #5A4E45; --ink-3: #9A8C7F;
  --line: #E8DDCF; --line-2: #D6C7B5;
  --green: #B3865A; --green-dark: #966F47; --green-soft: #F3E6D6; --green-deep: #3E2D1C;
  --accent: #D9B98F;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="salbei"] {
  --bg: #F3F5F1; --bg-2: #E5EBE3; --paper: #FCFDFA;
  --ink: #1E2A24; --ink-2: #44554C; --ink-3: #8A9A91;
  --line: #D7E2D9; --line-2: #BFCFC3;
  --green: #76957F; --green-dark: #5C7A66; --green-soft: #E2EDE5; --green-deep: #22362F;
  --accent: #C9D8C2;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="pflaume"] {
  --bg: #F6F1F5; --bg-2: #ECE1EA; --paper: #FDFBFD;
  --ink: #2A1E2A; --ink-2: #56455A; --ink-3: #978A99;
  --line: #E5D8E2; --line-2: #D2C1CE;
  --green: #86476E; --green-dark: #6B3557; --green-soft: #F0E0EC; --green-deep: #331A2D;
  --accent: #D7B6CE;
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}
html[data-theme="eigene"] {
  --bg: var(--fs-paper-2); --bg-2: var(--fs-paper-3); --paper: var(--fs-surface);
  --ink: var(--fs-ink); --ink-2: var(--fs-ink-2); --ink-3: var(--fs-ink-3);
  --line: var(--fs-line); --line-2: var(--fs-ink-3);
  --green: var(--fs-primary); --green-dark: var(--fs-primary-hover); --green-soft: var(--fs-tint); --green-deep: var(--fs-dark-1);
  --accent: var(--fs-bright);
  --warn: #C63A2E; --warn-soft: #FBEBE8;
}

/* ============ BASIS ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: -0.01em; line-height: 1.06; color: var(--ink); }
h1 { font-size: clamp(44px, 5.8vw, 80px); font-weight: 300; letter-spacing: -0.015em; }
h2 { font-size: clamp(34px, 4.2vw, 58px); font-weight: 300; }
h3 { font-size: clamp(21px, 2vw, 27px); line-height: 1.22; font-weight: 400; }
h1 strong, h2 strong { font-weight: 500; }
/* Squircle: moderne Browser runden weicher, ältere bekommen normale Rundung */
.btn, .nav-cta, .kc-drop, .kc-btn, .pm-sheet, .pr-row, .pr-thumb, .bento-card, .cform, .f-opt, .chip, .check-phone, .rt-col, .rt-banner figure, .about-photo, .faq-list, .contact-card, .pr-cta, .cform input, .cform textarea, .ok-ico, .duo-stage { corner-shape: squircle; }
.mark { color: var(--green-dark); }
p { color: var(--ink-2); }
.arr { display: inline-block; transition: transform .2s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.wrap { max-width: var(--max); margin: 0 auto; }
.lead { font-size: clamp(17px, 1.4vw, 20px); line-height: 1.55; color: var(--ink-2); }
.foot-note { font-size: 13px; line-height: 1.55; color: var(--ink-3); }
section { padding: clamp(72px, 10vh, 130px) var(--pad-x); position: relative; }
.s-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: clamp(36px, 5vh, 64px); }
.s-head h2 { max-width: 26ch; }
.s-head p { max-width: 420px; font-size: 16.5px; }
.s-num { display: none; }

/*@@REUSE_CSS@@*/

/* Übernommene Regeln anpassen */
.wrap { padding: 0; }
.nav-links { gap: 22px; font-size: 14.5px; white-space: nowrap; }
.nav-cta { white-space: nowrap; }
.brand-text { white-space: nowrap; }
.brand { font-weight: 600; }
.nav-cta { font-weight: 600; }
.btn-primary { font-weight: 600; }

/* ============ HERO ============ */
.hero { position: relative; overflow: hidden; min-height: 92vh; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; background: var(--bg); padding: 0; }
.hero-copy { padding: clamp(130px, 18vh, 190px) var(--pad-x) clamp(70px, 10vh, 110px); max-width: 720px; justify-self: end; width: 100%; }
.hero-media { position: relative; height: 100%; min-height: 92vh; }
.hero-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 78% 18%; }
.hero-media::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, var(--bg) 0%, color-mix(in oklab, var(--bg) 55%, transparent) 18%, transparent 45%); pointer-events: none; }
.hero h1 { margin-bottom: 26px; }
.hero h1 em { font-style: normal; font-weight: 500; color: var(--green-dark); }
.hero p.sub { font-size: clamp(17px, 1.4vw, 20px); color: var(--ink-2); max-width: 520px; margin-bottom: 36px; line-height: 1.55; }
.hero-ctas { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 30px; }
.link-more { font-weight: 500; color: var(--ink); border-bottom: 1px solid var(--line-2); padding-bottom: 2px; transition: border-color .2s; }
.link-more:hover { border-color: var(--ink); }
.hero-facts { font-size: 13.5px; color: var(--ink-2); display: flex; gap: 8px 22px; flex-wrap: wrap; padding-top: 22px; border-top: 1px solid var(--line); }
.hero-facts > span { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.hero-facts svg { width: 17px; height: 17px; color: var(--green-dark); flex-shrink: 0; }

/* ============ KENNST DU DAS ============ */
.know { background: var(--bg); padding-bottom: clamp(40px, 6vh, 72px); }
.know-grid { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.know-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 26px; display: flex; flex-direction: column; gap: 10px; }
.know-card .q { font-family: var(--display); font-size: clamp(22px, 2.1vw, 28px); line-height: 1.2; color: var(--ink); }
.know-card p { font-size: 15px; }
.know-bridge { max-width: var(--max); margin: 26px auto 0; font-family: var(--display); font-size: clamp(20px, 2vw, 28px); font-weight: 300; color: var(--ink); line-height: 1.35; }

/* ============ INNEN & AUSSEN ============ */
:root { --aussen: #F1DDD2; --aussen-ink: #A3623F; --innen: #E6C4D1; --innen-ink: #7A2E46; }
html[data-theme="salbei"] { --aussen: #E7E9DC; --aussen-ink: #6B7A55; --innen: #DCE5E0; --innen-ink: #2F5A4A; }
html[data-theme="sand"] { --aussen: #F0E2D0; --aussen-ink: #9A6B3E; --innen: #E8D3CB; --innen-ink: #7F4A3C; }
.duo { background: var(--paper); padding-top: 0; }
.duo-stage { position: relative; height: clamp(420px, 60vw, 760px); overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
.duo-half { position: relative; display: flex; align-items: center; }
.duo-half.aussen { background: var(--aussen); justify-content: flex-start; padding-left: clamp(20px, 6vw, 96px); }
.duo-half.innen { background: var(--innen); justify-content: flex-end; padding-right: clamp(20px, 6vw, 96px); }
.duo-word { font-family: var(--display); font-size: clamp(40px, 8.5vw, 140px); font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
.duo-half.aussen .duo-word { color: var(--aussen-ink); }
.duo-half.innen .duo-word { color: var(--innen-ink); }
.duo-person { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 104%; width: auto; max-width: none; object-fit: contain; object-position: bottom; filter: drop-shadow(0 30px 40px rgba(60,20,30,0.25)); }
.duo-cols { max-width: var(--max); margin: clamp(28px, 4vh, 48px) auto 0; padding: 0 var(--pad-x); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 3vw, 48px); }
.duo-col h3 { margin-bottom: 6px; }
.duo-col.c-aussen h3 { color: var(--aussen-ink); }
.duo-col.c-innen h3 { color: var(--innen-ink); }
.duo-col p { font-size: 17px; max-width: 460px; }
.duo-result { max-width: var(--max); margin: 26px auto 0; padding: 0 var(--pad-x); font-family: var(--display); font-size: clamp(22px, 2.4vw, 34px); font-weight: 300; line-height: 1.3; color: var(--ink); }
.duo-result strong { font-weight: 500; }
.duo-note { max-width: var(--max); margin: 22px auto 0; padding: 0 var(--pad-x); }

/* ============ ROUTINE ============ */
.routine { background: var(--bg); }
.rt-banner { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: var(--max); margin: 0 auto clamp(28px, 4vh, 48px); }
.rt-banner figure { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r); overflow: hidden; background: var(--bg-2); }
.rt-banner img { width: 100%; height: 100%; object-fit: cover; }
.rt-banner figcaption { position: absolute; left: 18px; bottom: 16px; padding: 7px 13px; border-radius: 100px; background: rgba(255,255,255,0.88); backdrop-filter: blur(8px); font-size: 13px; font-weight: 600; color: var(--ink); }
.rt-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: var(--max); margin: 0 auto; }
.rt-col { background: var(--paper); border-radius: var(--r); padding: 28px 28px 16px; }
.rt-col h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.rt-col h3 span.t { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.rt-step { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); }
.rt-step:last-child { border-bottom: 0; }
.rt-step i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--green-dark); line-height: 1; }
.rt-step b { font-weight: 500; font-size: 17px; color: var(--ink); }
.rt-step small { font-size: 13px; color: var(--ink-3); text-align: right; white-space: nowrap; }
.rt-foot { max-width: var(--max); margin: 22px auto 0; font-size: 15px; color: var(--ink-2); }

/* ============ BEAUTY-CHECK ============ */
.check { background: var(--paper); }
.check-grid { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: minmax(300px, 440px) 1fr; gap: clamp(32px, 6vw, 96px); align-items: center; }
.check-phone { position: relative; aspect-ratio: 2 / 3; border-radius: var(--r); overflow: hidden; background: var(--bg-2); }
.check-phone img { width: 100%; height: 100%; object-fit: cover; }
/* Skinscan: Ring aus kurzen grünen Strichen um das Gesicht, das Leuchten wandert im Kreis */
.scan-ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.scan-ring line { stroke: #4CCB7F; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-width: 6px; opacity: .35; animation: scanPulse 3.2s linear infinite; filter: drop-shadow(0 0 2px rgba(61,210,122,0.6)); }
@keyframes scanPulse { 0% { opacity: .3; } 8% { opacity: 1; } 22% { opacity: .55; } 100% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .scan-ring line { animation: none; opacity: .8; } }
.check-copy h2 { margin: 14px 0 20px; max-width: 12ch; }
.check-copy .lead { margin-bottom: 30px; max-width: 480px; }
.ck-steps { list-style: none; display: grid; gap: 0; margin-bottom: 30px; max-width: 520px; }
.ck-steps li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--line); font-size: 17px; color: var(--ink); }
.ck-steps li:last-child { border-bottom: 1px solid var(--line); }
.ck-steps i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--green-dark); line-height: 1; }
.ck-steps li span { display: block; font-size: 14.5px; color: var(--ink-3); margin-top: 2px; }
.ck-ctas { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.ck-free { font-size: 14px; color: var(--ink-3); }
.ck-note { margin-top: 18px; font-size: 13.5px; color: var(--ink-3); max-width: 520px; }

/* ============ VORTEILE · Bento ============ */
.why { background: var(--bg); }
.bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.bento-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 30px 28px; display: flex; flex-direction: column; gap: 12px; min-height: 280px; position: relative; overflow: hidden; }
.bento-card.span2 { grid-column: span 2; }
.bento-card.span3 { grid-column: span 3; }
.bento-card .eyebrow { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); }
.bento-card h3 { font-size: clamp(22px, 2.1vw, 30px); max-width: 22ch; }
.bento-card p { font-size: 15.5px; line-height: 1.55; max-width: 560px; }
.bento-card p.small { font-size: 13.5px; color: var(--ink-3); margin-top: auto; }
.bento-card.dark { background: radial-gradient(circle at 80% 20%, color-mix(in oklab, var(--green) 35%, transparent), transparent 55%), var(--green-deep); color: #fff; border-color: transparent; justify-content: center; padding: 44px 40px; }
.bento-card.dark .eyebrow { color: var(--accent); }
.bento-card.dark h3, .bento-card.dark p { color: #fff; }
.bento-card.dark p { color: rgba(255,255,255,0.8); }
.bento-list { list-style: none; display: grid; gap: 0; margin-top: 6px; }
.bento-list li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); }
.bento-list li b { font-weight: 600; color: var(--ink); }
.bento-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.bento-chips span { padding: 7px 12px; border-radius: 100px; background: var(--green-soft); color: var(--green-deep); font-size: 13.5px; font-weight: 500; }
.bento-card.sand { background: linear-gradient(135deg, var(--green-soft), color-mix(in oklab, var(--green-soft) 60%, var(--paper))); border-color: transparent; min-height: 0; }
.bento-guar { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; }
.bento-guar h3 { font-size: clamp(24px, 2.4vw, 34px); }
.guar-badge { width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--green-dark); color: var(--green-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.guar-badge b { font-size: 56px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; }
.guar-badge span { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; margin-top: 4px; }

/* ============ PRODUKTE ============ */
.products { background: var(--paper); padding: 0 0 clamp(72px, 10vh, 130px); }
.pr-stage { position: relative; height: clamp(300px, 42vw, 560px); overflow: hidden; background: var(--bg-2); }
.pr-stage img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
.pr-stage::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,253,252,0) 55%, var(--paper) 100%); }
.pr-stage-copy { max-width: var(--max); margin: -10px auto 0; padding: 0 var(--pad-x); position: relative; z-index: 2; }
.pr-stage-copy p { font-size: 17px; max-width: 520px; margin-top: 10px; }
.pr-wrap { max-width: var(--max); margin: 0 auto; padding: clamp(28px, 4vh, 48px) var(--pad-x) 0; display: grid; gap: clamp(28px, 4vh, 44px); }
.pr-block-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
.pr-block-head h3 { font-size: clamp(20px, 2vw, 26px); }
.pr-block-head > span { font-size: 14px; color: var(--ink-3); }
.pr-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.pr-tiles.small { grid-template-columns: repeat(5, 1fr); }
.pr-tiles.three { grid-template-columns: repeat(3, 1fr); max-width: 760px; }
.pr-tile { position: relative; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .2s var(--ease), box-shadow .2s, border-color .2s; }
.pr-tile:hover { transform: translateY(-3px); box-shadow: 0 18px 36px -22px rgba(60,20,30,0.3); border-color: var(--line-2); }
.pr-tile img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-sm); margin-bottom: 8px; }
.pr-tile b { font-weight: 500; font-size: 15px; color: var(--ink); line-height: 1.25; }
.pr-tile b small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.pr-tile > span:last-child { font-size: 13px; color: var(--ink-3); }
.pr-step { position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 600; color: var(--green-dark); display: flex; align-items: center; justify-content: center; }
.pr-tile.innen .pr-step { background: var(--innen); color: var(--innen-ink); border-color: transparent; }
.pr-tiles.small .pr-tile { padding: 12px 10px 14px; }
.pr-tiles.small .pr-tile b { font-size: 14px; }
.pr-cta { background: var(--green-deep); color: #fff; border-radius: var(--r); padding: clamp(28px, 4vw, 44px); display: grid; grid-template-columns: 1.15fr 1fr; gap: 32px; align-items: center; }
.pr-cta h3 { color: #fff; font-size: clamp(26px, 2.8vw, 38px); margin-bottom: 10px; max-width: 16ch; }
.pr-cta h3 strong { font-weight: 500; color: var(--accent); }
.pr-cta p { color: rgba(255,255,255,0.78); font-size: 16px; max-width: 480px; margin-bottom: 22px; }
.pr-cta .btn-primary { background: #fff; color: var(--green-deep); }
.pr-cta .btn-primary:hover { background: var(--green-soft); color: var(--green-deep); }
/* Ergebnis-UI (Beispiel, neutral gestaltet) */
.result-ui { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: var(--r); padding: 20px 20px 16px; display: grid; gap: 14px; max-width: 400px; justify-self: end; width: 100%; }
.ru-head { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.7); }
.ru-head em { font-style: normal; color: #fff; }
.ru-score { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 14px; }
.ru-score svg { width: 110px; }
.ru-score b { display: block; font-family: var(--display); font-size: 40px; font-weight: 300; line-height: 1; }
.ru-score > span { font-size: 13px; color: rgba(255,255,255,0.65); }
