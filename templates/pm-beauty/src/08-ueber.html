<!-- ÜBER MICH -->
<section class="about" id="ueber">
  <div class="about-grid">
    <div class="about-photo reveal">
      <img loading="lazy" decoding="async" width="600" height="750" src="{{about_bild}}" alt="{{vorname}} {{nachname}}">
    </div>
    <div class="about-copy">
      <h2><span class="l-de">{{{about_intro_de_html}}}</span><span class="l-en">{{{about_intro_en_html}}}</span></h2>
      <div class="about-text">
        <span class="l-de">{{about_me_html}}</span>
        <span class="l-en">{{about_me_html_en}}</span>
      </div>
      <div class="about-sig">{{vorname}} {{nachname}}</div>
    </div>
  </div>
</section>
